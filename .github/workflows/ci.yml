name: CI com diagnóstico GenAI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas: ler o código e comentar no Pull Request.
permissions:
  contents: read
  pull-requests: write

jobs:
  # Equivalente ao stage "test" do GitLab. Vai falhar de propósito.
  unit_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes unitários
        run: |
          set -o pipefail
          echo "Rodando testes unitários..."
          pytest test_app.py -v 2>&1 | tee test_output.log

      # Guarda o log mesmo quando o teste falha, para o agente de IA ler.
      - name: Publicar log dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test_output.log
          retention-days: 7

  # Equivalente ao stage "genai_analysis" com when: on_failure.
  ai_debugger:
    needs: unit_test
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar log do job que falhou
        uses: actions/download-artifact@v4
        with:
          name: test-log

      - name: Diagnóstico com IA generativa
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Falha detectada. Iniciando agente de IA..."
          python genai_analyst.py test_output.log
